name: Publish Helm Chart

on:
  release:
    types:
      - created

permissions:
  contents: write

env:
  HELM_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p dist

          helm package . \
            --version "$VERSION" \
            --destination dist

      - name: Checkout gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git worktree add gh-pages origin/gh-pages
          else
            git worktree add --detach gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

      - name: Generate repository index
        run: |
          cp dist/*.tgz gh-pages/

          if [ -f gh-pages/index.yaml ]; then
            helm repo index gh-pages \
              --url "$HELM_REPO_URL" \
              --merge gh-pages/index.yaml
          else
            helm repo index gh-pages \
              --url "$HELM_REPO_URL"
          fi

      - name: Generate website
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          cat > gh-pages/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Base Helm Chart</title>
          </head>
          <body>
            <h1>Base Helm Chart</h1>

            <p>Reusable Helm library chart for deploying services.</p>

            <h2>Latest Release</h2>
            <p><strong>$VERSION</strong></p>

            <h2>Helm Repository</h2>

            <pre>helm repo add base-helm-chart $HELM_REPO_URL
          helm repo update</pre>

            <h2>Available Charts</h2>

            <p>
              <a href="index.yaml">View index.yaml</a>
            </p>

            <h2>Usage</h2>

            <pre>dependencies:
              - name: base-helm-chart
                version: $VERSION
                repository: $HELM_REPO_URL</pre>

            <p>
              <a href="${{ github.server_url }}/${{ github.repository }}">
                View source on GitHub
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Publish
        run: |
          cd gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html index.yaml *.tgz

          git commit \
            -m "chore(release): publish ${GITHUB_REF_NAME}"

          git push origin HEAD:gh-pages
